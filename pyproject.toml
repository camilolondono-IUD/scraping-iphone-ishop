[project]
name = "scraping-iphone-ishop"
version = "1.0.0"
description = "Web scraping educativo del iPhone 18 Pro y 18 Pro Max en iShop Colombia con BeautifulSoup"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
